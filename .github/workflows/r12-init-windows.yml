name: R12 init Windows gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/r12-init-windows.yml"
      - "README.md"
      - "dayu/cli/arg_parsing.py"
      - "dayu/cli/commands/init.py"
      - "dayu/cli/init_catalog.py"
      - "dayu/cli/init_environment.py"
      - "dayu/cli/init_workspace.py"
      - "dayu/config/README.md"
      - "dayu/service/entrypoint_runtime.py"
      - "dayu/service/host_assembly.py"
      - "tests/README.md"
      - "tests/cli/test_init_catalog.py"
      - "tests/cli/test_init_command.py"
      - "tests/cli/test_init_environment.py"
      - "tests/cli/test_init_smoke.py"
      - "tests/cli/test_init_workspace.py"
      - "tests/cli/test_upload_filings_from_command.py"
      - "constraints/lock-windows-x64-py311.txt"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  windows-init-transaction:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DAYU_R12_WINDOWS_ARTIFACT_DIR: ${{ github.workspace }}\workspace\tmp\r12-init-windows
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked test environment
        run: python -m pip install -e ".[test,dev]" -c constraints/lock-windows-x64-py311.txt

      - name: Record name-safe runner evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:DAYU_R12_WINDOWS_ARTIFACT_DIR | Out-Null
          $rmtreeCapability = python -c "import shutil; print(shutil.rmtree.avoids_symlink_attacks)"
          @(
            "os=$([System.Environment]::OSVersion.VersionString)"
            "python=$(python --version 2>&1)"
            "rmtree_avoids_symlink_attacks=$rmtreeCapability"
          ) | Set-Content -Path "$env:DAYU_R12_WINDOWS_ARTIFACT_DIR\versions.txt" -Encoding utf8
          @(
            "OPENAI_API_KEY"
            "TAVILY_API_KEY"
            "SERPER_API_KEY"
            "FMP_API_KEY"
            "HF_ENDPOINT"
            "HF_TOKEN"
          ) | Set-Content -Path "$env:DAYU_R12_WINDOWS_ARTIFACT_DIR\environment-names.txt" -Encoding utf8
          Get-FileHash -Algorithm SHA256 -Path @(
            "dayu/cli/commands/init.py"
            "dayu/cli/init_workspace.py"
            "tests/cli/test_init_smoke.py"
          ) |
            Select-Object Path, Algorithm, Hash |
            ConvertTo-Json |
            Set-Content -Path "$env:DAYU_R12_WINDOWS_ARTIFACT_DIR\source-hashes.json" -Encoding utf8

      - name: Run real Windows init transaction and filesystem gates
        shell: pwsh
        run: |
          $junitPath = "$env:DAYU_R12_WINDOWS_ARTIFACT_DIR\init-pytest-junit.xml"
          python -m pytest `
            tests/cli/test_init_smoke.py::test_windows_real_four_state_and_config_reload `
            tests/cli/test_init_smoke.py::test_windows_real_preseeded_junction_fails_closed `
            tests/cli/test_init_smoke.py::test_windows_real_symlink_privilege_or_fail_closed `
            tests/cli/test_init_smoke.py::test_windows_real_workspace_root_identity_drift_is_rejected `
            tests/cli/test_init_smoke.py::test_windows_real_setx_round_trip_is_name_safe_and_cleaned `
            tests/cli/test_init_smoke.py::test_platform_capability_is_explicit `
            tests/cli/test_init_workspace.py::test_publication_replace_failure_rolls_back_original_config `
            tests/cli/test_init_workspace.py::test_windows_scan_delete_race_does_not_follow_replaced_nested_link `
            "--junitxml=$junitPath" -q

      - name: Run R11 real cmd and upload nodes
        if: always()
        shell: pwsh
        run: |
          $junitPath = "$env:DAYU_R12_WINDOWS_ARTIFACT_DIR\r11-pytest-junit.xml"
          python -m pytest `
            tests/cli/test_upload_filings_from_command.py::test_windows_cmd_script_round_trips_adversarial_argv_with_real_cmd `
            tests/cli/test_upload_filings_from_command.py::test_windows_generated_script_runs_real_cli_into_temp_storage `
            "--junitxml=$junitPath" -q

      - name: Upload name-safe Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-init-windows-${{ github.run_id }}
          path: workspace/tmp/r12-init-windows/**
          retention-days: 14
          if-no-files-found: error
