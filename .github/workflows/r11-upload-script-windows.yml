name: R11 upload script Windows gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/r11-upload-script-windows.yml"
      - "README.md"
      - "dayu/README.md"
      - "dayu/cli/arg_parsing.py"
      - "dayu/cli/commands/fins.py"
      - "dayu/cli/run_keys.py"
      - "dayu/cli/upload_script.py"
      - "dayu/fins/README.md"
      - "dayu/fins/upload_batch.py"
      - "dayu/render/__init__.py"
      - "dayu/render/render.py"
      - "dayu/web/__init__.py"
      - "dayu/web/__main__.py"
      - "dayu/wechat/__init__.py"
      - "dayu/wechat/main.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "tests/README.md"
      - "tests/cli/test_arg_parsing.py"
      - "tests/cli/test_fins_commands.py"
      - "tests/cli/test_public_package_entrypoints.py"
      - "tests/cli/test_run_keys.py"
      - "tests/cli/test_upload_filings_from_command.py"
      - "tests/fins/test_upload_batch.py"

permissions:
  contents: read

jobs:
  windows-upload-script:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DAYU_R11_WINDOWS_ARTIFACT_DIR: ${{ github.workspace }}\workspace\tmp\r11-windows
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked test environment
        run: python -m pip install -e ".[test,dev]" -c constraints/lock-windows-x64-py311.txt

      - name: Capture runner environment and verify cmd execution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:DAYU_R11_WINDOWS_ARTIFACT_DIR | Out-Null
          @(
            "os=$([System.Environment]::OSVersion.VersionString)"
            "platform=$([System.Environment]::OSVersion.Platform)"
            "python=$(python --version 2>&1)"
          ) | Set-Content -Path "$env:DAYU_R11_WINDOWS_ARTIFACT_DIR\environment.txt" -Encoding utf8
          cmd.exe /d /c ver 2>&1 | Set-Content -Path "$env:DAYU_R11_WINDOWS_ARTIFACT_DIR\cmd-version.txt" -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            throw "cmd.exe execution failed with exit code $LASTEXITCODE"
          }
          cmd.exe /? 2>&1 | Set-Content -Path "$env:DAYU_R11_WINDOWS_ARTIFACT_DIR\cmd-help.txt" -Encoding utf8
          $cmdHelpExitCode = $LASTEXITCODE
          "cmd_help_exit_code=$cmdHelpExitCode" | Add-Content -Path "$env:DAYU_R11_WINDOWS_ARTIFACT_DIR\environment.txt" -Encoding utf8
          if ($cmdHelpExitCode -notin @(0, 1)) {
            throw "cmd.exe help returned unclassified exit code $cmdHelpExitCode"
          }

      - name: Run real cmd recorder and CLI storage gates
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:DAYU_R11_WINDOWS_ARTIFACT_DIR | Out-Null
          $stdoutPath = "$env:DAYU_R11_WINDOWS_ARTIFACT_DIR\pytest-stdout.txt"
          $stderrPath = "$env:DAYU_R11_WINDOWS_ARTIFACT_DIR\pytest-stderr.txt"
          $junitPath = "$env:DAYU_R11_WINDOWS_ARTIFACT_DIR\pytest-junit.xml"
          python -m pytest tests/cli/test_run_keys.py::test_new_running_key_monitor_uses_noop_for_non_posix_tty tests/cli/test_upload_filings_from_command.py::test_windows_cmd_script_round_trips_adversarial_argv_with_real_cmd tests/cli/test_upload_filings_from_command.py::test_windows_generated_script_runs_real_cli_into_temp_storage tests/cli/test_arg_parsing.py::test_upload_actions_default_to_auto_and_batch_rejects_delete "--junitxml=$junitPath" -q 1> $stdoutPath 2> $stderrPath
          $pytestExitCode = $LASTEXITCODE
          Get-Content -Path $stdoutPath
          $stderrText = Get-Content -Path $stderrPath -Raw
          if ($stderrText.Length -gt 0) {
            [Console]::Error.Write($stderrText)
          }
          if ($pytestExitCode -ne 0) {
            exit $pytestExitCode
          }

          $recorderDirectory = Join-Path $env:DAYU_R11_WINDOWS_ARTIFACT_DIR "cmd-recorder"
          $cliDirectory = Join-Path $env:DAYU_R11_WINDOWS_ARTIFACT_DIR "cli-storage"
          $recorderScript = Join-Path $recorderDirectory "generated-upload.cmd"
          $recorderOracle = Join-Path $recorderDirectory "recorder-oracle.jsonl"
          $cliScript = Join-Path $cliDirectory "cli-generated-upload.cmd"
          $cliOracle = Join-Path $cliDirectory "cli-grammar-oracle.json"
          $requiredEvidence = @($recorderScript, $recorderOracle, $cliScript, $cliOracle)
          $missingEvidence = @($requiredEvidence | Where-Object {
            -not (Test-Path -LiteralPath $_ -PathType Leaf)
          })
          if ($missingEvidence.Count -ne 0) {
            throw "missing deterministic Windows evidence: $($missingEvidence -join ', ')"
          }

          $recorderRows = @(Get-Content -LiteralPath $recorderOracle)
          if ($recorderRows.Count -ne 1) {
            throw "expected one recorder oracle row, got $($recorderRows.Count)"
          }
          $cliEvidence = Get-Content -LiteralPath $cliOracle -Raw | ConvertFrom-Json
          if (
            $cliEvidence.test_node -ne "test_windows_generated_script_runs_real_cli_into_temp_storage" -or
            $cliEvidence.result -ne "passed" -or
            $cliEvidence.cmd_invocation -ne "cmd.exe /d /c"
          ) {
            throw "CLI evidence contract mismatch"
          }
          $generatedScriptHash = (Get-FileHash -LiteralPath $cliScript -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($cliEvidence.generated_script_sha256 -ne $generatedScriptHash) {
            throw "CLI generated script hash mismatch"
          }
          $portfolioRoot = Join-Path $cliDirectory "portfolio"
          if (-not (Test-Path -LiteralPath $portfolioRoot -PathType Container)) {
            throw "real CLI gate produced no portfolio directory"
          }
          $sourceArtifacts = @(Get-ChildItem -LiteralPath $portfolioRoot -File -Recurse)
          if (
            $sourceArtifacts.Count -eq 0 -or
            $sourceArtifacts.Count -ne [int]$cliEvidence.source_artifact_count
          ) {
            throw "CLI source artifact count mismatch: actual=$($sourceArtifacts.Count) expected=$($cliEvidence.source_artifact_count)"
          }

      - name: Upload Windows gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r11-windows-upload-script-${{ github.run_id }}
          path: workspace/tmp/r11-windows/**
          retention-days: 14
          if-no-files-found: error
